# Greyfinch fork: build the graphql-engine image and push it to ECR.
#
# This replaces Hasura's upstream pipeline (see git history of this file), which
# needs Hasura's private builder image and contexts and can't run here. When
# rebasing onto a new upstream release, a conflict in this file is resolved by
# keeping this version (during a rebase that is "theirs": git checkout --theirs).
#
# Docs: packaging/graphql-engine/README.md
version: 2.1

jobs:
  build_push_hasura_graphql_engine:
    machine:
      image: ubuntu-2404:current
    # Native arm64 (our ECS tasks are ARM64; QEMU is far too slow for GHC).
    # GHC needs ~12-16 GB of RAM, hence xlarge.
    resource_class: arm.xlarge
    steps:
      # build.sh derives the upstream version from the "ci: tag release" commit in
      # history, so the checkout must not be shallow.
      - checkout
      - run:
          name: Check git history is complete
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --unshallow
            fi
            packaging/graphql-engine/build.sh --print-tag
      - run:
          name: Log in to Docker Hub (avoids anonymous pull rate limits)
          command: |
            if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
              echo "${DOCKERHUB_PASSWORD}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin
            else
              echo "DOCKERHUB_USERNAME not set, pulling anonymously"
            fi
      - run:
          name: Build image and push to ECR
          # A cold GHC compile takes about an hour; docker output keeps streaming,
          # but allow for quiet stretches.
          no_output_timeout: 120m
          command: |
            # AWS_ACCOUNT_ID and AWS_DEFAULT_REGION come from the CircleCI context.
            # Same image and tag go to each repository; `latest` is moved in all of them.
            : "${AWS_ACCOUNT_ID:?set AWS_ACCOUNT_ID in the hasura-ecr-push context}"
            : "${AWS_DEFAULT_REGION:?set AWS_DEFAULT_REGION in the hasura-ecr-push context}"
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
            export ECR_REPO="\
              ${ECR_REGISTRY}/gf-training-hasura-graphql-engine \
              ${ECR_REGISTRY}/greyfinch-demo-hasura-graphql-engine \
              ${ECR_REGISTRY}/greyfinch-staging-hasura-graphql-engine \
              ${ECR_REGISTRY}/hub-production-hasura-graphql-engine"
            packaging/graphql-engine/build.sh --push

workflows:
  build_push_hasura_graphql_engine:
    jobs:
      - build_push_hasura_graphql_engine:
          # AWS_ACCOUNT_ID, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION
          # (and optionally DOCKERHUB_USERNAME / DOCKERHUB_PASSWORD).
          context: hasura-ecr-push
          # Pushes finishing out of order must not leave `latest` on an older commit.
          serial-group: << pipeline.project.slug >>/hasura-graphql-engine-push
          filters:
            branches:
              only: greyfinch
